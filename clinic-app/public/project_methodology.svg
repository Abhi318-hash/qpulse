<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="15" />

  <text x="400" y="50" fill="#e2e8f0" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Q-PULSE Project Methodology &amp; Architecture</text>

  <!-- Next.js Frontend/Backend -->
  <g transform="translate(300, 150)">
    <rect width="200" height="120" fill="url(#cardGrad)" rx="10" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <text x="100" y="40" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Next.js App</text>
    <text x="100" y="70" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">Server Actions</text>
    <text x="100" y="95" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">App Router &amp; UI</text>
  </g>

  <!-- Turso / LibSQL -->
  <g transform="translate(300, 350)">
    <rect width="200" height="100" fill="url(#cardGrad)" rx="10" stroke="#a78bfa" stroke-width="2" filter="url(#glow)" />
    <text x="100" y="40" fill="#a78bfa" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Turso (LibSQL)</text>
    <text x="100" y="70" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">Persistent Edge DB</text>
  </g>

  <!-- Clients -->
  <g transform="translate(50, 150)">
    <rect width="150" height="120" fill="url(#cardGrad)" rx="10" stroke="#f472b6" stroke-width="2" />
    <text x="75" y="40" fill="#f472b6" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">End Users</text>
    <text x="75" y="70" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">Public Dashboard</text>
    <text x="75" y="95" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">PWA / Mobile</text>
  </g>

  <g transform="translate(550, 150)">
    <rect width="150" height="120" fill="url(#cardGrad)" rx="10" stroke="#fbbf24" stroke-width="2" />
    <text x="75" y="40" fill="#fbbf24" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Admins &amp; Staff</text>
    <text x="75" y="70" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">QR / Admin Panel</text>
  </g>

  <!-- Connectors -->
  <!-- Users to Next.js -->
  <line x1="200" y1="210" x2="290" y2="210" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" />
  <polygon points="290,205 300,210 290,215" fill="#94a3b8" />

  <!-- Admins to Next.js -->
  <line x1="550" y1="210" x2="510" y2="210" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" />
  <polygon points="510,205 500,210 510,215" fill="#94a3b8" />

  <!-- Next.js to DB -->
  <line x1="400" y1="270" x2="400" y2="340" stroke="#94a3b8" stroke-width="2" />
  <polygon points="395,340 400,350 405,340" fill="#94a3b8" />
  <polygon points="395,280 400,270 405,280" fill="#94a3b8" />
  <rect x="410" y="295" width="60" height="20" fill="#1e293b" rx="4" />
  <text x="440" y="310" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Queries</text>

</svg>
